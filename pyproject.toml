[tool.ruff]
# Configuración de Ruff - Linter y formatter ultra-rápido para Python
# https://docs.astral.sh/ruff/

# Longitud máxima de línea
line-length = 100

# Directorio de archivos Python
src = ["apps", "config"]

# Archivos y directorios a excluir
exclude = [
    ".git",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "migrations",
    "*.pyc",
    "staticfiles",
    "media",
]

# Python version
target-version = "py312"

[tool.ruff.lint]
# Reglas a activar (equivalente a flake8, isort, black, etc.)
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DJ",     # flake8-django
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "Q",      # flake8-quotes
    "S",      # flake8-bandit (seguridad)
    "T20",    # flake8-print
    "RUF",    # Ruff-specific rules
]

# Reglas a ignorar
ignore = [
    "E501",   # Longitud de línea (ya controlado por line-length)
    "S101",   # Usar assert (común en tests)
    "S311",   # random no es seguro (OK para desarrollo)
    "DJ001",  # Django model sin __str__ (a veces intencional)
    "T201",   # print() statements (útil para debugging)
    "N815",   # mixedCase en serializers - API usa camelCase intencionalmente
    "N802",   # Nombres de métodos en serializers - API usa camelCase
    "N803",   # Argumentos en views - API usa camelCase para parámetros de URL
]

# Permitir fix automático para estas reglas
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Ignorar reglas específicas en ciertos archivos
"**/tests.py" = ["S101", "S105", "S106"]  # Asserts y hardcoded passwords OK en tests
"**/test_*.py" = ["S101", "S105", "S106"]
"**/settings.py" = ["F405", "S104", "S105", "E402"]  # Star imports, bind all, secrets, imports order OK en desarrollo
"**/migrations/*.py" = ["ALL"]  # No lint migrations

[tool.ruff.lint.isort]
# Configuración de ordenamiento de imports (isort)
known-first-party = ["apps", "config"]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
# Django en su propia sección
"django" = ["django", "rest_framework"]

[tool.ruff.format]
# Configuración del formatter (equivalente a Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.pydocstyle]
# Estilo de docstrings
convention = "google"

[tool.coverage.run]
# Configuración de coverage
source = ["apps"]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
# Reporte de coverage
precision = 2
show_missing = true
skip_covered = false

[tool.mypy]
# Configuración de Mypy - Type checker estático
# https://mypy.readthedocs.io/en/stable/config_file.html

# Python version
python_version = "3.13"

# Plugins necesarios para Django
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

# Nivel de estrictez (empezamos moderado, se puede aumentar gradualmente)
warn_return_any = false  # Demasiado estricto para Django
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false  # Puede generar muchos false positives
warn_no_return = true
warn_unreachable = false  # Django a veces genera código "inalcanzable" válido

# Chequeos adicionales
check_untyped_defs = false  # Muy estricto, activar gradualmente
disallow_untyped_decorators = false  # Django usa muchos decorators sin tipos

# No requerir tipos en todo (progresivo)
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Permitir some flexibility con Django
allow_untyped_calls = true
allow_untyped_defs = true

# Configuración Django-específica
strict_optional = true
no_implicit_optional = true

# Archivos a excluir
exclude = [
    "migrations/",
    "venv/",
    ".venv/",
    "build/",
    "dist/",
]

# Mostrar códigos de error
show_error_codes = true
show_column_numbers = true
pretty = true

[tool.django-stubs]
# Configuración del plugin django-stubs
django_settings_module = "config.settings"
strict_settings = false  # No requerir tipos en settings.py
